<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>News Drop — прогнозы на турниры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main id="app"><div class="loading">Загрузка…</div></main>
  <div id="toast"></div>
  <script>
    // любые ошибки — прямо на экран, чтобы было видно, что сломалось
    window.addEventListener('error', function (e) {
      var a = document.getElementById('app');
      if (a) a.insertAdjacentHTML('beforeend', '<p style="color:#ff4d57;font-size:12px;text-align:center">Ошибка: ' + (e.message || 'файл не загрузился: ' + ((e.target && (e.target.src || e.target.href)) || '?')) + '</p>');
    }, true);
  </script>
  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
  <script>
    // если app.js не загрузился (кэш Telegram, файл не найден) — не висим на «Загрузке» молча
    setTimeout(function () {
      var l = document.querySelector('#app .loading');
      if (l && !window.PREDICT_LOADED) l.innerHTML = 'Не удалось загрузить приложение.<br>Закрой окно и открой ссылку ещё раз.<br><br><small>код: app.js не загрузился</small>';
    }, 10000);
  </script>
</body>
</html>
