<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>News Drop — прогнозы на турниры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main id="app"><div class="loading">Загрузка…</div></main>
  <div id="toast"></div>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    // если app.js не загрузился (кэш Telegram, файл не найден) — не висим на «Загрузке» молча
    setTimeout(function () {
      var l = document.querySelector('#app .loading');
      if (l && !window.PREDICT_LOADED) l.innerHTML = 'Не удалось загрузить приложение.<br>Закрой окно и открой ссылку ещё раз.<br><br><small>код: app.js не загрузился</small>';
    }, 10000);
  </script>
</body>
</html>
